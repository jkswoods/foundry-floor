site_name: Foundry Floor
site_description: Modular factory architecture for Hytale
repo_url: https://github.com/jkswoods/foundry-floor
repo_name: Source on GitHub
edit_uri: ""
docs_dir: docs
site_dir: build/player-site
theme:
  name: readthedocs
  logo: assets/brand/logo.svg
  highlightjs: false
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
extra_css:
  - assets/brand/foundry.css
exclude_docs: |
  /CATALOG.md
  /INTERACTIONS.md
  /SOUND-EFFECTS.md
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Installation: installation.md
  - First factory bay: getting-started.md
  - The Foundry Workbench: features/workbench.md
  - Block collection:
      - Overview: features/index.md
      - Floors and walkways: features/architecture.md
      - Doors, shutters and lighting: features/mechanisms.md
      - Freight lift and call panels: features/lift.md
  - Recipes: recipes.md
  - Building progression: progression.md
  - Configuration and access: configuration.md
  - Troubleshooting: troubleshooting.md
  - Gallery: gallery.md
  - Changelog: changelog.md
